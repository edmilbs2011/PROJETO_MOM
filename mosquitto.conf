# Broker local — sem autenticação, sem limites de conexões ou assinaturas


listener 1883 127.0.0.1
allow_anonymous true

# Sem limite de conexões simultâneas (0 = ilimitado)
max_connections -1

# Sem limite de assinaturas por cliente (0 = ilimitado)
max_subscriptions 0

# Mensagens retidas (necessário para lista_topicos)
persistence false
